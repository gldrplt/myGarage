<!DOCTYPE html>
<html lang=""en">
<head>
<meta name="viewport" content="width=device-width">

<title>unknown hostname</title>
<link rel="icon" type="image/x-icon" href="{{url_for('static', filename='images/color-garage.png')}}">
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/gwstyles.css') }}">

<!-- get hostname -->
<!-- update title -->
<script>
    const hn = {{ hostname|tojson }};
    document.title = 'myGarage - ' + hn;
</script>

<script type="text/javascript" src="{{ url_for('static', filename='js/mygarageclock.js') }}"></script>

<script type="text/javascript" src="static/js/GarageStatus.js"></script>

</head>

<body onload="updateTime('clock')" bgcolor={{garcolor}}>

<center>
    <br>
    <p id="name"> {{garname}} </p>
    <p id="status"> {{garstatus}}</p>
    <p id="clock">time goes here</p>


    <form action="/Garage" method="post" id="garageform">
        <input class="a" id="garagecode" name="garagecode" type="text "pattern="[0-9]*" value="" STYLE="background-color:white;">
    </form>
    <img id="img1" src={{garimg}} width="70%" onclick="document.forms['garageform'].submit();">
    <p> Enter Activation Code </p><br>
    <br><a href="/Log" class="link">Show Log File</a><br>
    <br><a href="/Parms" class="link">Show config parms</a><br>
    <br><a href="/ShowParmForm" class="link">Update config parameters</a><br><br>
    <br><br><a href="/MyClock" class="link">Manage MyClock</a><br><br>
    <br><br><input type="button" class="link" value="Reload Page" onclick="document.location.reload()"><br><br>

</center>
</body>
</html>
